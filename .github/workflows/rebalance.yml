# Daily rebalance against Alpaca.
#
# Scheduled runs are ALWAYS paper. Live trading is only reachable through a
# manual "Run workflow" with mode=live, and it uses a separate pair of secrets
# so paper keys can never touch the live account.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ALPACA_API_KEY / ALPACA_SECRET_KEY            paper keys
#   ALPACA_LIVE_API_KEY / ALPACA_LIVE_SECRET_KEY  live keys (only if you go live)

name: Rebalance (Alpaca)

on:
  schedule:
    # 22:00 UTC = 6pm EDT / 5pm EST, well after the 4pm ET close so the day's bar exists.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "paper or live"
        type: choice
        options: [paper, live]
        default: paper
      execute:
        description: "submit orders (off = dry run)"
        type: boolean
        default: true
      force:
        description: "rebalance even if today is not a scheduled rebalance day"
        type: boolean
        default: false
      strategy:
        description: "strategy name"
        default: momentum
      params:
        description: "k=v,k=v strategy params"
        default: "top_n=10"
      universe:
        description: "universe spec"
        default: "sp500+etfs"

concurrency:
  group: rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode || 'paper' }}
      STRATEGY: ${{ inputs.strategy || 'momentum' }}
      PARAMS: ${{ inputs.params || 'top_n=10' }}
      UNIVERSE: ${{ inputs.universe || 'sp500+etfs' }}
      EXECUTE_FLAG: ${{ (github.event_name == 'schedule' || inputs.execute) && '--execute' || '' }}
      FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[alpaca]"

      - name: Restore bar cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Select credentials
        run: |
          if [ "$MODE" = "live" ]; then
            echo "ALPACA_API_KEY=${{ secrets.ALPACA_LIVE_API_KEY }}" >> "$GITHUB_ENV"
            echo "ALPACA_SECRET_KEY=${{ secrets.ALPACA_LIVE_SECRET_KEY }}" >> "$GITHUB_ENV"
            echo "ALPACA_PAPER=false" >> "$GITHUB_ENV"
            echo "LIVE_FLAG=--live" >> "$GITHUB_ENV"
          else
            echo "ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}" >> "$GITHUB_ENV"
            echo "ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}" >> "$GITHUB_ENV"
            echo "ALPACA_PAPER=true" >> "$GITHUB_ENV"
            echo "LIVE_FLAG=" >> "$GITHUB_ENV"
          fi
      - name: Check credentials
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error::Alpaca secrets for mode=$MODE are not set in this repository"; exit 1
          fi

      - name: Account before
        run: algofun status --broker alpaca $LIVE_FLAG

      - name: Rebalance
        run: |
          algofun rebalance --broker alpaca $LIVE_FLAG \
            --strategy "$STRATEGY" --params "$PARAMS" --universe "$UNIVERSE" \
            --refresh --start 2000-01-01 --min-bars 300 \
            $EXECUTE_FLAG $FORCE_FLAG

      - name: Let fills settle
        if: env.EXECUTE_FLAG != ''
        run: sleep 20

      - name: Account after
        if: always()
        run: algofun status --broker alpaca $LIVE_FLAG

      - name: Save bar cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: bars-${{ github.run_id }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebalance-log-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
