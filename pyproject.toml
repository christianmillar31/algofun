[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algofun"
version = "0.1.0"
description = "An honest algorithmic trading lab: data, backtesting, walk-forward evaluation, paper and live execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "alpaca-py>=0.30"]

[project.scripts]
algofun = "algofun.cli:main"

[tool.setuptools.packages.find]
include = ["algofun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long docstring/help lines are fine
